<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Random Site</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #1e3a8a, transparent 35%),
        radial-gradient(circle at bottom right, #7c3aed, transparent 35%),
        #050816;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 900px;
      text-align: center;
      padding: 50px 30px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 30px;
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 80px rgba(0,0,0,.4);
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #93c5fd;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(40px, 8vw, 80px);
      margin-bottom: 20px;
      background: linear-gradient(90deg, #fff, #93c5fd, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .result {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 25px 0;
      border-radius: 20px;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.1);
      font-size: 22px;
      font-weight: bold;
    }

    button {
      border: none;
      padding: 16px 35px;
      border-radius: 50px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: .3s;
      box-shadow: 0 10px 30px rgba(37,99,235,.3);
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 40px rgba(124,58,237,.5);
    }

    .number {
      margin-top: 25px;
      font-size: 14px;
      color: #94a3b8;
    }

    .dot {
      position: absolute;
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      opacity: .3;
      animation: float 8s infinite ease-in-out;
    }

    @keyframes float {
      0%,100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-40px);
      }
    }
  </style>
</head>

<body>

  <div class="dot" style="top:15%;left:10%"></div>
  <div class="dot" style="top:70%;left:15%;animation-delay:2s"></div>
  <div class="dot" style="top:20%;right:15%;animation-delay:1s"></div>
  <div class="dot" style="bottom:15%;right:10%;animation-delay:3s"></div>

  <div class="container">

    <div class="logo">RANDOM.DEV</div>

    <h1>Random Idea</h1>

    <p>
      Har bosganingda yangi tasodifiy g‘oya,
      raqam yoki motivatsion fikr paydo bo‘ladi.
    </p>

    <div class="result" id="result">
      🎲 Tugmani bosib ko‘r...
    </div>

    <button onclick="generateRandom()">
      ✨ Random qilish
    </button>

    <div class="number">
      Random number: <span id="number">—</span>
    </div>

  </div>

  <script>

    const ideas = [
      "Bugun yangi bir narsa o‘rgan 🚀",
      "O‘z g‘oyangni real loyihaga aylantir 💡",
      "AI bilan yangi imkoniyat yarat 🤖",
      "Biror kishiga yaxshi gap ayt ❤️",
      "Bugun kechagidan yaxshiroq bo‘l.",
      "Kichik qadamlar katta natija beradi.",
      "Tasavvur qil. Yarat. Sinab ko‘r.",
      "Nega kutyapsan? Boshlash vaqti keldi.",
      "Bugungi random g‘oya: sayt yarat!",
      "Impossible? Balki hali urinib ko‘rmagandirsan."
    ];

    function generateRandom() {

      const result = document.getElementById("result");
      const number = document.getElementById("number");

      result.style.transform = "scale(.8)";
      result.style.opacity = "0";

      setTimeout(() => {

        const randomIdea =
          ideas[Math.floor(Math.random() * ideas.length)];

        const randomNumber =
          Math.floor(Math.random() * 1000000);

        result.innerText = randomIdea;
        number.innerText = randomNumber;

        result.style.transform = "scale(1)";
        result.style.opacity = "1";

      }, 250);
    }

  </script>

</body>
</html>
